# Dataset: "MEN_ESTADISTICAS MATRICULA POR MUNICIPIOS_ES" (Ministerio de Educación), id y9ga-zwzy.
# Matrícula de educación superior por municipio y año (2005-2021 según la ficha). Datos agregados, sin personas.
#
# Verificado contra la API el 2026-11-01. Para otro dataset, VERIFICA antes de correr: abre https://www.datos.gov.co/resource/y9ga-zwzy.json?$limit=2
# y compara las claves con las de abajo. Los nombres salen de una vista hermana del dataset (dqzt-9yfq),
# NO de este mismo: pueden diferir (por ejemplo "a_o" vs "ano").
dataset:
  id: "y9ga-zwzy"
  domain: "www.datos.gov.co"
  name: "Matrícula de educación superior por municipio (MEN)"
  page_size: 5000
  max_rows: 50000
  granularity: yearly       # cada fila ya es un año completo
columns:
  year: "a_o"
  category: "nombre_del_departamento"
  # Se SUMAN solo conteos de estudiantes por nivel. NO incluyas "ies_con_oferta": es número de instituciones, no de estudiantes.
  value_columns:
    - "tecnica_profesional"
    - "tecnologica"
    - "universitaria"
    - "especializacion"
    - "maestria"
    - "doctorado"
  # La fuente publica casi todos los registros de 2005-2020 dos veces (a veces con el nombre del municipio
  # escrito distinto). Misma clave + mismas cifras = copia. Ver docs/RECONCILIACION.md.
  key: ["a_o", "c_digo_delmunicipio"]
  # "nombre_del_departamento" trae el código DIVIPOLA, a veces sin cero inicial ("5" y "05").
  category_labels:
    "05": "Antioquia"
    "5": "Antioquia"
    "08": "Atlántico"
    "8": "Atlántico"
    "11": "Bogotá D.C."
    "13": "Bolívar"
    "15": "Boyacá"
    "17": "Caldas"
    "18": "Caquetá"
    "19": "Cauca"
    "20": "Cesar"
    "23": "Córdoba"
    "25": "Cundinamarca"
    "27": "Chocó"
    "41": "Huila"
    "44": "La Guajira"
    "47": "Magdalena"
    "50": "Meta"
    "52": "Nariño"
    "54": "Norte de Santander"
    "63": "Quindío"
    "66": "Risaralda"
    "68": "Santander"
    "70": "Sucre"
    "73": "Tolima"
    "76": "Valle del Cauca"
